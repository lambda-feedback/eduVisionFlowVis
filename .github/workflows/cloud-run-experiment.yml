name: Cloud Run experiment

# Experiment: does a background thread keep running after the response on
# Google Cloud Run when the service has "CPU always allocated"? On AWS Lambda
# the instance is frozen once the function answers.
#
# This deploys the function as the separate Cloud Run service
# eduvisionflowvis-staging (the Lambda Feedback staging and production
# functions on AWS Lambda are not touched), then sets that service up for the
# test: CPU always allocated, 2 GiB of memory, one instance, one request at a
# time, and a 60-minute request timeout. The service is public: send it
# evaluation requests directly (see "Background heartbeat" in the README).
#
# Runs when this file changes on main, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloud-run-experiment.yml

env:
  SERVICE: eduvisionflowvis-staging
  REGION: europe-west2
  PROJECT: wolfram-evaluation-functions

jobs:
  deploy:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: lambda-feedback/evaluation-function-workflows/.github/workflows/deploy.yml@main
    with:
      template-repository-name: "lambda-feedback/evaluation-function-boilerplate-python"
      build-platforms: "gcp"
      region: "europe-west2"
      environment: "staging"
      lfs: false
    secrets:
      # Required by the shared workflow even when it deploys to GCP.
      aws-key-id: ${{ secrets.LAMBDA_CONTAINER_PIPELINE_AWS_ID }}
      aws-secret-key: ${{ secrets.LAMBDA_CONTAINER_PIPELINE_AWS_SECRET }}
      gcp_credentials: ${{ secrets.GCP_DEPLOY }}

  configure:
    needs: deploy
    # Also after a failed deploy: the first revision may run out of the
    # default 512 MiB of memory, and the new settings fix that.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY }}

      - name: Set up the service for the experiment
        run: |
          gcloud run services update "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --no-cpu-throttling \
            --cpu 1 \
            --memory 2Gi \
            --concurrency 1 \
            --max-instances 1 \
            --timeout 3600

      - name: Show the service URL
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          echo "::notice title=Cloud Run experiment URL::$url"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'yaml(spec.template.metadata.annotations, spec.template.spec.containerConcurrency, spec.template.spec.timeoutSeconds, spec.template.spec.containers[0].resources)'
