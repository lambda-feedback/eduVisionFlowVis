name: Cloud Run experiment cleanup

# One-off: deletes the eduvisionflowvis-staging Cloud Run service and its
# container image, which the removed Cloud Run experiment created. Runs when
# this file is added to main; delete this file once it has run.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloud-run-cleanup.yml

env:
  SERVICE: eduvisionflowvis-staging
  REGION: europe-west2
  PROJECT: wolfram-evaluation-functions
  IMAGE: europe-west2-docker.pkg.dev/wolfram-evaluation-functions/evaluation-function-staging/eduvisionflowvis

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY }}

      - name: Delete the Cloud Run service
        run: |
          if gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            gcloud run services delete "$SERVICE" --project "$PROJECT" --region "$REGION" --quiet
          else
            echo "The service does not exist."
          fi

      - name: Delete the container image
        continue-on-error: true
        run: gcloud artifacts docker images delete "$IMAGE" --delete-tags --quiet

      - name: Confirm
        run: |
          if gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            echo "::error title=Cloud Run cleanup::The service $SERVICE still exists"
            exit 1
          fi
          echo "::notice title=Cloud Run cleanup::The service $SERVICE has been deleted"
